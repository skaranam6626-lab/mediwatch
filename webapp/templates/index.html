<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediWatch – Patient Readmission</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384XQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <style>
        :root {
            --primary: #1b2d6b;
            --secondary: #363e75;
            --accent: #4a6cf7;
            --bg: #eff2f9;
            --card: #ffffff;
            --border: #dde3f0;
            --text-muted: #6c757d;
            --risk-high: #e74c3c;
            --risk-medium: #f39c12;
            --risk-low: #27ae60;
        }

        body {
            background: var(--bg);
            color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Header */
        .site-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #fff;
            padding: 1.25rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(27, 45, 107, 0.15);
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }
        .header-brand {
            flex: 1;
            min-width: 0;
        }
        .site-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        .site-header .subtitle {
            opacity: 0.85;
            font-size: 0.95rem;
            margin: 0.25rem 0 0;
            line-height: 1.3;
        }
        .nav-link-custom {
            color: rgba(255,255,255,0.9);
            font-weight: 600;
            text-decoration: none;
            padding: 0.5rem 1.1rem;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 6px;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1.4;
        }
        .nav-link-custom:hover {
            color: #fff;
            background: rgba(255,255,255,0.12);
            text-decoration: none;
        }
        @media (max-width: 575px) {
            .header-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-link-custom {
                text-align: center;
            }
        }

        /* Form cards */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 2px 8px rgba(27, 45, 107, 0.04);
        }
        .section-title {
            color: var(--secondary);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1.1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--bg);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        label {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.35rem;
        }
        .form-control, .custom-select {
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.92rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus, .custom-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }

        /* Medications collapse */
        .med-toggle {
            cursor: pointer;
            user-select: none;
        }
        .med-toggle .chevron {
            transition: transform 0.2s;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .med-toggle[aria-expanded="true"] .chevron {
            transform: rotate(180deg);
        }
        .med-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: auto;
        }

        /* Submit button */
        .btn-predict {
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0.85rem 2rem;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 14px rgba(74, 108, 247, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-predict:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.45);
            color: #fff;
        }
        .btn-predict:active {
            transform: translateY(0);
        }

        /* Result panel */
        .result-panel {
            position: sticky;
            top: 1.5rem;
        }
        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            min-height: 280px;
            box-shadow: 0 2px 8px rgba(27, 45, 107, 0.04);
        }
        .result-placeholder {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
        }
        .result-placeholder .icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            opacity: 0.4;
        }
        .result-outcome {
            text-align: center;
            padding: 1rem 0;
        }
        .risk-badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
        }
        .risk-high { background: #fde8e8; color: var(--risk-high); }
        .risk-medium { background: #fef5e7; color: #d68910; }
        .risk-low { background: #e6f4ea; color: var(--risk-low); }
        .result-message {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary);
            line-height: 1.5;
        }
        .result-detail {
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .result-error {
            background: #fde8e8;
            color: #c0392b;
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.9rem;
        }

        /* Loading overlay */
        #loading {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(239, 242, 249, 0.85);
            z-index: 9999;
            backdrop-filter: blur(2px);
        }
        .loader-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .loader {
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        .loader-text {
            color: var(--secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 991px) {
            .result-panel { position: static; margin-top: 1.5rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="container">
        <div class="header-bar">
            <div class="header-brand">
                <h1>MediWatch</h1>
                <p class="subtitle mb-0">Patient Readmission Risk Predictor</p>
            </div>
            <a href="/monitoring" class="nav-link-custom">Drift Monitoring →</a>
        </div>
    </div>
</header>

<div class="container pb-5">
    <div class="row">
        <div class="col-lg-8">
            <form id="patient-form">

                <div class="form-card">
                    <h5 class="section-title">
                        <span class="section-icon">👤</span> Demographics
                    </h5>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="race">Race</label>
                            <select class="custom-select" id="race" name="race" required>
                                <option value="">Select…</option>
                                {% for value in encoded['race'].values() %}
                                <option value="{{ value }}">{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="gender">Gender</label>
                            <select class="custom-select" id="gender" name="gender" required>
                                <option value="">Select…</option>
                                {% for value in encoded['gender'].values() %}
                                <option value="{{ value }}">{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="age">Age</label>
                            <select class="custom-select" id="age" name="age" required>
                                <option value="">Select…</option>
                                {% for value in encoded['age'].values() %}
                                <option value="{{ value }}">{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-card">
                    <h5 class="section-title">
                        <span class="section-icon">🏥</span> Admission &amp; Clinical
                    </h5>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="admission_type_id">Admission Type</label>
                            <select class="custom-select" id="admission_type_id" name="admission_type_id" required>
                                <option value="">Select…</option>
                                <option value="1">1 – Emergency</option>
                                <option value="2">2 – Urgent</option>
                                <option value="3">3 – Elective</option>
                                <option value="4">4 – Newborn</option>
                                <option value="5">5 – Not Available</option>
                                <option value="6">6 – NULL</option>
                                <option value="7">7 – Trauma Center</option>
                                <option value="8">8 – Not Mapped</option>
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="admission_source_id">Admission Source ID</label>
                            <input type="number" class="form-control" id="admission_source_id"
                                   name="admission_source_id" min="1" max="25" placeholder="1–25" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="discharge_disposition_id">Discharge Disposition ID</label>
                            <input type="number" class="form-control" id="discharge_disposition_id"
                                   name="discharge_disposition_id" min="1" max="30" placeholder="1–30" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="num_lab_procedures">Lab Procedures</label>
                            <input type="number" class="form-control" id="num_lab_procedures"
                                   name="num_lab_procedures" min="0" placeholder="e.g. 41" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="num_medications">Medications Count</label>
                            <input type="number" class="form-control" id="num_medications"
                                   name="num_medications" min="1" placeholder="e.g. 14" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="num_procedures">Procedures</label>
                            <input type="number" class="form-control" id="num_procedures"
                                   name="num_procedures" min="0" placeholder="e.g. 0" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="number_diagnoses">Diagnoses</label>
                            <input type="number" class="form-control" id="number_diagnoses"
                                   name="number_diagnoses" min="1" placeholder="e.g. 9" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="number_emergency">Prior Emergency</label>
                            <input type="number" class="form-control" id="number_emergency"
                                   name="number_emergency" min="0" placeholder="e.g. 0" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="number_inpatient">Prior Inpatient</label>
                            <input type="number" class="form-control" id="number_inpatient"
                                   name="number_inpatient" min="0" placeholder="e.g. 1" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="number_outpatient">Prior Outpatient</label>
                            <input type="number" class="form-control" id="number_outpatient"
                                   name="number_outpatient" min="0" placeholder="e.g. 0" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="time_in_hospital">Days in Hospital</label>
                            <input type="number" class="form-control" id="time_in_hospital"
                                   name="time_in_hospital" min="1" max="14" placeholder="e.g. 3" required>
                        </div>
                    </div>
                </div>

                <div class="form-card">
                    <h5 class="section-title">
                        <span class="section-icon">📋</span> Diagnoses
                    </h5>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="diag_1">Diagnosis 1</label>
                            <select class="custom-select" id="diag_1" name="diag_1" required>
                                <option value="">Select…</option>
                                {% for value in encoded['diag_1'].values() | sort %}
                                <option value="{{ value }}">{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="diag_2">Diagnosis 2</label>
                            <select class="custom-select" id="diag_2" name="diag_2">
                                <option value="">Select…</option>
                                {% for value in encoded['diag_2'].values() | sort %}
                                <option value="{{ value }}">{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="diag_3">Diagnosis 3</label>
                            <select class="custom-select" id="diag_3" name="diag_3">
                                <option value="">Select…</option>
                                {% for value in encoded['diag_3'].values() | sort %}
                                <option value="{{ value }}">{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-card">
                    <h5 class="section-title med-toggle" data-toggle="collapse" data-target="#medSection"
                        aria-expanded="false" aria-controls="medSection">
                        <span class="section-icon">💊</span> Medications
                        <span class="med-count">19 fields — click to expand</span>
                        <span class="chevron ml-2">▼</span>
                    </h5>
                    <div class="collapse" id="medSection">
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for="metformin">Metformin</label>
                                <select class="custom-select med-select" id="metformin" name="metformin" required>
                                    {% for value in encoded['metformin'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="repaglinide">Repaglinide</label>
                                <select class="custom-select med-select" id="repaglinide" name="repaglinide" required>
                                    {% for value in encoded['repaglinide'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="nateglinide">Nateglinide</label>
                                <select class="custom-select med-select" id="nateglinide" name="nateglinide" required>
                                    {% for value in encoded['nateglinide'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="chlorpropamide">Chlorpropamide</label>
                                <select class="custom-select med-select" id="chlorpropamide" name="chlorpropamide" required>
                                    {% for value in encoded['chlorpropamide'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="glimepiride">Glimepiride</label>
                                <select class="custom-select med-select" id="glimepiride" name="glimepiride" required>
                                    {% for value in encoded['glimepiride'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="acetohexamide">Acetohexamide</label>
                                <select class="custom-select med-select" id="acetohexamide" name="acetohexamide" required>
                                    {% for value in encoded['acetohexamide'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="glipizide">Glipizide</label>
                                <select class="custom-select med-select" id="glipizide" name="glipizide" required>
                                    {% for value in encoded['glipizide'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="glyburide">Glyburide</label>
                                <select class="custom-select med-select" id="glyburide" name="glyburide" required>
                                    {% for value in encoded['glyburide'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="tolbutamide">Tolbutamide</label>
                                <select class="custom-select med-select" id="tolbutamide" name="tolbutamide" required>
                                    {% for value in encoded['tolbutamide'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="pioglitazone">Pioglitazone</label>
                                <select class="custom-select med-select" id="pioglitazone" name="pioglitazone" required>
                                    {% for value in encoded['pioglitazone'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="rosiglitazone">Rosiglitazone</label>
                                <select class="custom-select med-select" id="rosiglitazone" name="rosiglitazone" required>
                                    {% for value in encoded['rosiglitazone'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="acarbose">Acarbose</label>
                                <select class="custom-select med-select" id="acarbose" name="acarbose" required>
                                    {% for value in encoded['acarbose'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="miglitol">Miglitol</label>
                                <select class="custom-select med-select" id="miglitol" name="miglitol" required>
                                    {% for value in encoded['miglitol'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="troglitazone">Troglitazone</label>
                                <select class="custom-select med-select" id="troglitazone" name="troglitazone" required>
                                    {% for value in encoded['troglitazone'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="tolazamide">Tolazamide</label>
                                <select class="custom-select med-select" id="tolazamide" name="tolazamide" required>
                                    {% for value in encoded['tolazamide'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="insulin">Insulin</label>
                                <select class="custom-select med-select" id="insulin" name="insulin" required>
                                    {% for value in encoded['insulin'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="glyburide-metformin">Glyburide-Metformin</label>
                                <select class="custom-select med-select" id="glyburide-metformin" name="glyburide-metformin" required>
                                    {% for value in encoded['glyburide-metformin'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="glipizide-metformin">Glipizide-Metformin</label>
                                <select class="custom-select med-select" id="glipizide-metformin" name="glipizide-metformin" required>
                                    {% for value in encoded['glipizide-metformin'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="glimepiride-pioglitazone">Glimepiride-Pioglitazone</label>
                                <select class="custom-select med-select" id="glimepiride-pioglitazone" name="glimepiride-pioglitazone" required>
                                    {% for value in encoded['glimepiride-pioglitazone'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="metformin-rosiglitazone">Metformin-Rosiglitazone</label>
                                <select class="custom-select med-select" id="metformin-rosiglitazone" name="metformin-rosiglitazone" required>
                                    {% for value in encoded['metformin-rosiglitazone'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="metformin-pioglitazone">Metformin-Pioglitazone</label>
                                <select class="custom-select med-select" id="metformin-pioglitazone" name="metformin-pioglitazone" required>
                                    {% for value in encoded['metformin-pioglitazone'].values() %}
                                    <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-card">
                    <h5 class="section-title">
                        <span class="section-icon">⚙️</span> Other
                    </h5>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="change">Medication Change</label>
                            <select class="custom-select" id="change" name="change" required>
                                {% for value in encoded['change'].values() %}
                                <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{% if value == 'Ch' %}Change{% else %}{{ value }}{% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="diabetesMed">Diabetes Medication</label>
                            <select class="custom-select" id="diabetesMed" name="diabetesMed" required>
                                {% for value in encoded['diabetesMed'].values() %}
                                <option value="{{ value }}"{% if value == 'No' %} selected{% endif %}>{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-predict btn-lg">Predict Readmission Risk</button>
            </form>
        </div>

        <div class="col-lg-4">
            <div class="result-panel">
                <h5 class="section-title" style="border-bottom-color: var(--border);">
                    <span class="section-icon">📊</span> Prediction Result
                </h5>
                <div class="result-card" id="result-card">
                    <div class="result-placeholder" id="result-placeholder">
                        <div class="icon">🔬</div>
                        <p class="mb-0">Fill in the patient details and click <strong>Predict Readmission Risk</strong> to see the outcome.</p>
                    </div>
                    <div id="result-output" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="loading">
    <div class="loader-wrap">
        <div class="loader"></div>
        <div class="loader-text">Running prediction…</div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script>
    var NUMERIC_FIELDS = [
        'admission_type_id', 'admission_source_id', 'discharge_disposition_id',
        'num_lab_procedures', 'num_medications', 'num_procedures', 'number_diagnoses',
        'number_emergency', 'number_inpatient', 'number_outpatient', 'time_in_hospital'
    ];

    function collectFormData() {
        var form = document.getElementById('patient-form');
        var data = {};
        Array.prototype.forEach.call(form.elements, function (el) {
            if (!el.name || el.disabled || el.type === 'submit') return;
            var name = el.name;
            var value = el.value;
            if (value === '' && (name === 'diag_2' || name === 'diag_3')) value = '?';
            if (NUMERIC_FIELDS.indexOf(name) !== -1) value = Number(value);
            data[name] = value;
        });
        return data;
    }

    function classifyRisk(readmission) {
        var text = (readmission || '').toLowerCase();
        if (text.indexOf('less than 30') !== -1) {
            return { level: 'high', label: 'High Risk', css: 'risk-high' };
        }
        if (text.indexOf('more than 30') !== -1) {
            return { level: 'medium', label: 'Moderate Risk', css: 'risk-medium' };
        }
        return { level: 'low', label: 'Low Risk', css: 'risk-low' };
    }

    function renderResult(data) {
        var placeholder = document.getElementById('result-placeholder');
        var output = document.getElementById('result-output');
        placeholder.style.display = 'none';
        output.style.display = 'block';

        var readmission = data.possibleReadmission || 'Unknown';
        var risk = classifyRisk(readmission);
        var now = new Date().toLocaleString();

        output.innerHTML =
            '<div class="result-outcome">' +
                '<span class="risk-badge ' + risk.css + '">' + risk.label + '</span>' +
                '<p class="result-message">Readmission expected ' + readmission + '</p>' +
                '<div class="result-detail">' +
                    '<div>Model: Random Forest</div>' +
                    '<div>Predicted at ' + now + '</div>' +
                '</div>' +
            '</div>';
    }

    function renderError(message) {
        var placeholder = document.getElementById('result-placeholder');
        var output = document.getElementById('result-output');
        placeholder.style.display = 'none';
        output.style.display = 'block';
        output.innerHTML = '<div class="result-error"><strong>Prediction failed</strong><br>' + message + '</div>';
    }

    document.getElementById('patient-form').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('loading').style.display = 'block';

        fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(collectFormData())
        })
        .then(function (response) {
            if (!response.ok) throw new Error('Server returned ' + response.status);
            return response.json();
        })
        .then(renderResult)
        .catch(function (error) { renderError(error.message); })
        .finally(function () { document.getElementById('loading').style.display = 'none'; });
    });
</script>
</body>
</html>
